spring.application.name=campus-cms
server.port=${PORT:8080}

# MongoDB (set MONGODB_URI in environment)
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true

# JWT (JWT_SECRET must be a Base64 string of at least 32 bytes)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:5173}

# One-time bootstrap of the FIRST admin (optional; only used if no admin exists)
app.bootstrap-admin.name=${BOOTSTRAP_ADMIN_NAME:}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

# Upload limits (used in the complaint phase)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
